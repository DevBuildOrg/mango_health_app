name: health_mango_scanner
description: AI-powered fruit & product scanner with Firebase authentication and personalized health recommendations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0

  # UI & State Management
  provider: ^6.0.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # HTTP
  http: ^1.1.0

  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
